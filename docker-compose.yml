# The services, with no ports published. Which ports a stack publishes is
# decided by the file layered on top:
#
#   docker compose up -d --build        development: docker-compose.override.yml,
#                                       which Compose loads on its own
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#                                       production: the frontend only
#
# Ports live only in the layers because a layer can add ports but not reliably
# take them away. Removing them needs `ports: !override`, which Compose before
# 2.24 ignores, merging the lists instead. Synology DSM ships 2.20, and the
# production file once relied on it: on an older Compose it published the
# database and the API to the network after all.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance"]
      interval: 2s
      timeout: 3s
      retries: 10
      # A first start initialises the data directory before Postgres answers,
      # which on a NAS-class CPU outlasts ten 2s retries. Failures in this
      # window do not count; it is healthy as soon as a check passes.
      start_period: 60s

  mailpit:
    image: axllent/mailpit

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://finance:finance@db:5432/finance?sslmode=disable
      PORT: "8080"
      # Whose X-Forwarded-For the API believes: this stack's own network and
      # nothing else. Its gateway is how a reverse proxy on the same host
      # reaches the frontend, and the frontend's nginx is how every request
      # reaches the API. It used to be every private range, which believed any
      # visitor on a LAN or a VPN about where they came from — and let them
      # take a fresh rate-limit bucket with every request. A proxy on another
      # machine goes in TRUSTED_PROXIES_EXTRA. See readmore/self-hosting.md.
      TRUSTED_PROXIES: "${NAFIN_SUBNET:-172.31.250.0/24},${TRUSTED_PROXIES_EXTRA:-}"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: "noreply@nafin.local"
      APP_URL: "http://localhost:3000"
      # No ENCRYPTION_KEY here. A key written in this file is a key everyone
      # can read: it once was, and the API now refuses that one by name (see
      # internal/auth/encryptionkey.go). Production sets its own from .env;
      # development generates one per machine (docker-compose.override.yml).
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Release builds: APP_VERSION="$(git describe --tags)" docker compose build frontend
        APP_VERSION: ${APP_VERSION:-}
    depends_on:
      - api

volumes:
  pgdata:

# Pinned, so that TRUSTED_PROXIES above can name it. Docker would otherwise pick
# a different subnet on every host, and the only way to trust "whichever it
# picked" was to trust every private range. Change NAFIN_SUBNET in .env if it
# collides with a network the host already has.
networks:
  default:
    ipam:
      config:
        - subnet: ${NAFIN_SUBNET:-172.31.250.0/24}
