name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go test ./... -v

  # The Go counterpart to "Type check": go test says whether the code behaves,
  # this says whether it is well-formed. Nothing checked either until now, which
  # is how three files sat unformatted long enough to look deliberate.
  #
  # Both steps always run. Left to fail fast, a formatting slip would hide
  # whatever vet had to say — the same way a single advisory once hid whether the
  # frontend suite passed at all.
  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            echo
            echo "Run: gofmt -w $unformatted"
            exit 1
          fi
      - name: go vet
        if: always()
        run: go vet ./...

  # Production must publish the frontend and nothing else. The database and the
  # API were once published anyway on Compose before 2.24, which ignores the
  # `!override` the production file used to remove the development ports. The
  # runner's Compose is newer and would never have shown it, so this checks for
  # the tag as well as the result. See docker-compose.yml.
  compose-ports:
    name: Compose ports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No tags an older Compose ignores
        run: |
          if grep -nE '^[^#]*!(override|reset)' docker-compose*.yml; then
            echo "Compose before 2.24 ignores these. Publish ports in a layer instead."
            exit 1
          fi
      - name: Production publishes the frontend only
        env:
          POSTGRES_PASSWORD: x
          CORS_ORIGINS: x
          APP_URL: x
          ENCRYPTION_KEY: x
        run: |
          published=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml config --format json \
            | jq -r '.services | to_entries[] | select(.value.ports) | .key' | sort -u)
          echo "Services with published ports: $published"
          [ "$published" = "frontend" ]

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Single source of truth, shared with frontend/Dockerfile.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test

  # Type checking, kept out of "Frontend tests" for the same reason npm audit is:
  # one job, one question. `npm test` answers "does it behave?", this answers
  # "do the types still describe it?", and a failure in one should not hide the
  # other.
  #
  # svelte-check exits non-zero on errors only. Warnings are printed but do not
  # fail the build, because a Svelte minor release can introduce new ones without
  # a line of our code changing — the same no-commit-turns-it-red problem the
  # audit split was solving. Warnings are still worth reading in the log.
  type-check:
    name: Type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Single source of truth, shared with frontend/Dockerfile.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check

  # Deliberately its own job rather than a step inside "Frontend tests".
  #
  # A dependency audit fails for reasons that have nothing to do with the code:
  # someone publishes an advisory against a transitive dev dependency and a green
  # build turns red with no commit. As a step it also ran BEFORE `npm test`, so a
  # single advisory hid whether the tests passed at all — which is how this repo
  # sat with red CI from April to August without anyone able to see the suite.
  #
  # Split out, the run summary answers both questions at a glance: "Frontend
  # tests" is about our code, "npm audit" is about the supply chain. This job is
  # still allowed to fail loudly — that is the point of having it.
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Single source of truth, shared with frontend/Dockerfile.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go test -tags=integration ./... -v
        env:
          DATABASE_URL: postgres://finance:finance@localhost:5432/finance?sslmode=disable
