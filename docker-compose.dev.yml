services:
  api:
    build: !reset null
    image: golang:1.23-alpine
    working_dir: /app
    command: sh -c "go build -o /tmp/api . && /tmp/api"
    ports: !override
      - "8081:8080"
    volumes:
      - ./backend:/app

  frontend:
    build: !reset null
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: !override
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
