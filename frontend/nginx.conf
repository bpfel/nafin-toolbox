server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://api.qrserver.com; connect-src 'self'" always;

    # index.html and version.json are how a browser finds out the hashed bundles
    # changed, so they must be revalidated every time. Without an explicit
    # Cache-Control nginx sends none at all, and browsers fall back to heuristic
    # caching — a tab then boots last week's bundle against today's API, and the
    # update banner cannot rescue it, because version.json is stale by the same
    # rule that made the bundle stale.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx's mime.types has no entry for .webmanifest, so it would go out as
    # application/octet-stream. Chrome tolerates that; nothing promises it will.
    #
    # No add_header here, so the server-level ones — the CSP and the no-cache —
    # still apply. The no-cache is the point: an installed copy finds a renamed
    # app or a new icon by revalidating this file, and nothing else tells it.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Hashed filenames, so the content behind a URL never changes. These are the
    # only things here worth caching, and they can be cached forever.
    #
    # The security headers are repeated because nginx's add_header does not
    # inherit into a level that declares one of its own: adding Cache-Control
    # here would otherwise silently drop the CSP from every script this app runs.
    location /assets/ {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://api.qrserver.com; connect-src 'self'" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
