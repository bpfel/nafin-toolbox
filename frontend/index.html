<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page run under the notch and the home
         indicator, so the env(safe-area-inset-*) paddings in the shell have
         something to measure. Without it they are always zero. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>nafin</title>
    <!-- Installable from the manifest alone; there is no service worker. See
         plans/pwa-plan.md for why, and for what a second tier would add. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- The page ground from app.css. One value: there is no dark theme yet. -->
    <meta name="theme-color" content="#f5f5f7" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
