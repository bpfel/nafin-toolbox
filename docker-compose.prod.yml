# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Requires .env file (see .env.example)
#
# Nothing here removes a port: docker-compose.yml publishes none, so this only
# adds the one it needs. See docker-compose.yml for why.

services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped

  api:
    environment:
      DATABASE_URL: postgres://finance:${POSTGRES_PASSWORD}@db:5432/finance?sslmode=disable
      COOKIE_SECURE: "true"
      CORS_ORIGINS: ${CORS_ORIGINS}
      APP_URL: ${APP_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    restart: unless-stopped

  mailpit:
    profiles: ["dev-only"]

  frontend:
    ports:
      # NAFIN_LISTEN=127.0.0.1:4000 in .env publishes on loopback only, for a
      # reverse proxy on the same host.
      - "${NAFIN_LISTEN:-4000}:3000"
    restart: unless-stopped
