# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Requires .env file (see .env.example)

services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: !override []
    restart: unless-stopped

  api:
    environment:
      DATABASE_URL: postgres://finance:${POSTGRES_PASSWORD}@db:5432/finance?sslmode=disable
      COOKIE_SECURE: "true"
      CORS_ORIGINS: ${CORS_ORIGINS}
      APP_URL: ${APP_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    ports: !override []
    restart: unless-stopped

  mailpit:
    profiles: ["dev-only"]

  frontend:
    ports: !override
      - "4000:3000"
    restart: unless-stopped
